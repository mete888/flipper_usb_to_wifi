name: Cross-platform host binaries

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "host/**"
      - "scripts/fibp_codec.py"
      - "scripts/fibp_simulator.py"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/package_desktop_host.py"
      - "setup.py"
      - "third_party/minimp3/**"
      - ".github/workflows/host-binaries.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Tests/PyInstaller import the checkout: keep its compiled decoder there,
      # instead of shadowing an installed wheel with an extension-free source tree.
      - run: python -m pip install -e ".[desktop]" pyinstaller
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Verify radio decoder is present in release binaries
        run: python -c "from host.fibp_host.radio_pcm import AVAILABLE; assert AVAILABLE"
      - if: runner.os != 'Windows'
        run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        run: python -m unittest tests.test_fibp_codec tests.test_host_network tests.test_host_permissions tests.test_host_session tests.test_host_transforms tests.test_toolbox_transforms tests.test_bluetooth_host tests.test_bluetooth_radio tests.test_radio_pcm tests.test_desktop_backend tests.test_desktop_gui tests.test_sdk_export
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        run: pyinstaller --onefile --collect-all bleak --collect-all keyring --icon host/assets/fib-bridge.ico --name fib-bridge-${{ matrix.asset }} host/fib_bridge_entry.py
      - if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --collect-all bleak --collect-all keyring --name fib-bridge-${{ matrix.asset }} host/fib_bridge_entry.py
      - name: Build compact desktop GUI and package notices
        run: python scripts/package_desktop_host.py --platform ${{ matrix.asset }}
      - name: Capture actual target-platform widgets (labelled preview)
        run: python -m scripts.capture_desktop_ui
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v7
        with:
          name: fib-bridge-${{ matrix.asset }}
          path: |
            dist/fib-bridge-${{ matrix.asset }}.exe
            dist/host-desktop/*.tar.gz
            dist/host-desktop/*.zip
            screenshots/desktop/*.png
